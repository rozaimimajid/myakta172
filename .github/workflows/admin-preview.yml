name: MyAKTA172 Admin Preview Tests
on:
  push:
    branches:
      - audit/stabilization-v1
    paths:
      - 'admin-preview.html'
      - 'admin-preview.css'
      - 'admin-preview.js'
      - 'admin-package-policy.js'
      - 'admin-related-access-guard.cjs'
      - 'admin-subscription-engine.cjs'
      - 'admin-backend-sqlite.cjs'
      - 'admin-backend-sqlite.sql'
      - 'admin-backend-postgresql.sql'
      - 'admin-backend-cloud-roles.sql'
      - 'admin-cloud-postgres.cjs'
      - 'admin-cloud-config.cjs'
      - 'admin-cloud-backend.cjs'
      - 'tests/admin-cloud-config.cjs'
      - 'tests/admin-cloud-backend-integration.cjs'
      - 'admin-auth-foundation.cjs'
      - 'tests/admin-auth-foundation.cjs'
      - 'tests/admin-auth-sqlite-integration.cjs'
      - 'tests/admin-postgresql-integration.cjs'
      - 'tests/admin-sqlite-integration.cjs'
      - 'tests/admin-auto-downgrade.cjs'
      - 'tests/admin-related-guard.cjs'
      - 'tests/admin-dashboard.mjs'
      - '.github/workflows/admin-preview.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admin-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Server-side related-sections entitlement and fail-closed regression
        run: node tests/admin-related-guard.cjs
      - name: Backend subscription expiry auto-downgrade regression
        run: node tests/admin-auto-downgrade.cjs
      - name: Isolated SQLite backend storage and auto-downgrade tests
        run: node --experimental-sqlite tests/admin-sqlite-integration.cjs
      - name: Signed identity and single-device authentication regression
        run: node tests/admin-auth-foundation.cjs
      - name: Trusted OIDC to private SQLite integration regression
        run: node --experimental-sqlite tests/admin-auth-sqlite-integration.cjs
      - name: Cloud backend TLS and nonowner role configuration
        run: node tests/admin-cloud-config.cjs
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Start isolated test server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/myakta-admin.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/admin-preview.html > /dev/null && exit 0; sleep 1; done
          exit 1
      - name: Admin package and browser regression
        run: node tests/admin-dashboard.mjs
        env:
          ADMIN_TEST_URL: http://127.0.0.1:8000

  postgres-staging-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: myakta_ci
          POSTGRES_PASSWORD: CI_EPHEMERAL_ONLY_NEVER_REAL
          POSTGRES_DB: myakta_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U myakta_ci -d myakta_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated PostgreSQL client for CI
        run: npm install --no-save pg@8.16.3
      - name: Migration and concurrency on ephemeral PostgreSQL
        run: node tests/admin-postgresql-integration.cjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: myakta_ci
          PGPASSWORD: CI_EPHEMERAL_ONLY_NEVER_REAL
          PGDATABASE: myakta_ci
      - name: Private backend role + signed sessions + protected premium gate
        run: node tests/admin-cloud-backend-integration.cjs
        env:
          PGHOST: 127.0.0.1
          PGPORT: '5432'
          PGUSER: myakta_ci
          PGPASSWORD: CI_EPHEMERAL_ONLY_NEVER_REAL
          PGDATABASE: myakta_ci
