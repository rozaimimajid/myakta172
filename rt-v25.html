<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RT V2.5 MyAKTA172</title><style>*{box-sizing:border-box}body{font:14px Arial;margin:0;background:#fff;color:#21344d}header{padding:22px;background:#09468d;color:#fff}header small{color:#ffce39;font-weight:800}h2{margin:7px 0}nav{position:sticky;top:0;z-index:3;background:#e9f2fc;display:flex;flex-wrap:wrap;gap:8px;padding:12px;justify-content:center}button{cursor:pointer;border:0;border-radius:8px;background:#0b58b2;color:#fff;padding:9px;font-weight:700}button[aria-selected=true]{outline:2px solid #ecb21e;background:#073a7b}main{display:flex;flex-direction:column;align-items:center;padding:20px;gap:12px}.step{width:min(560px,100%);text-align:center;padding:16px;background:#e8f2ff;border:2px solid #a9c9ef;border-radius:13px}.step h3{margin:0 0 8px;color:#0757b0}.step p{line-height:1.5}.refs{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}.arrow{font-size:25px;color:#0b61bd}.pill{border-radius:35px;background:#146043;color:white;padding:15px;width:min(560px,100%);text-align:center;font-weight:800}.diamond{position:relative;display:flex;align-items:center;justify-content:center;min-height:100px;width:min(440px,100%);padding:22px 45px;color:#65460b;font-weight:800;text-align:center}.diamond svg{position:absolute;inset:0;width:100%;height:100%;z-index:0}.diamond polygon{fill:#fff6e2;stroke:#b78221;stroke-width:2;vector-effect:non-scaling-stroke}.diamond span{position:relative;z-index:1}.branches{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(750px,100%)}.branch{padding:13px;border:1px solid #c9dbed;border-top:3px solid #19845b;border-radius:10px;text-align:center}.branch:last-child{border-top-color:#c27c33}.branch b{color:#075cbb}.branch p{font-size:13px;line-height:1.5}.intro{margin:18px 25px;color:#475d73;line-height:1.5}.up{position:fixed;bottom:18px;right:18px;border:2px solid white;box-shadow:0 3px 14px #0004;border-radius:30px}@media(max-width:570px){.branches{grid-template-columns:1fr}header{padding:15px}h2{font-size:20px}nav button{font-size:12px}}@media print{nav,.up{display:none}.step,.branches,.diamond{break-inside:avoid}}</style></head><body><header><small>MyAKTA172 V2.5 • CARTA ALIR PROSES</small><h2>Rancangan Tempatan (RT)</h2></header><nav><button data-mode="sedia">Penyediaan RT</button><button data-mode="ubah">Pengubahan RT</button><button data-mode="ganti">Penggantian RT</button><button onclick="print()">⎙ Cetak</button></nav><p class="intro">Carta panduan pembelajaran berdasarkan Akta 172, bukan pengganti prosedur rasmi PBPT dan JPN. Rujuk juga Seksyen 16A jika penyediaan diarahkan kepada Pengarah Negeri.</p><main id="chart"></main><button class="up" onclick="scrollTo({top:0,behavior:'smooth'})">↑ Ke Atas</button><script>const stages=[["Semak asas penyediaan RT","PBPT menyemak keperluan penyediaan dan kesesuaian dengan rancangan struktur.",["12"]],["Sediakan draf RT","Sediakan draf, cadangan dan bahan perihalan mengikut peruntukan berkaitan.",["12"]],["Publisiti dan pemeriksaan awam","Maklumkan peluang pemeriksaan draf serta bantahan dan representasi.",["13"]],["Penilaian bantahan dan siasatan","Pertimbangkan bantahan, termasuk siasatan atau pendengaran jika terpakai.",["14"],"Adakah bantahan memerlukan tindakan lanjut?","Laksanakan siasatan atau pendengaran yang berkenaan.","Teruskan pertimbangan draf."],["Pertimbangan dan kelulusan","Pertimbangkan draf dan sebarang pengubahsuaian menurut tatacara kelulusan.",["15"],"Adakah draf diluluskan?","Teruskan tatacara pemberitahuan.","Buat tindakan susulan atau pindaan yang diarahkan."],["Pemberitahuan dan kuat kuasa","Lengkapkan pemberitahuan yang ditetapkan bagi RT yang diluluskan.",["15"]]],opening={"sedia":[["Pengesahan permulaan RT","PBPT memulakan penyediaan RT mengikut peruntukan Seksyen 12.",["12"]]],"ubah":[["Cadangan pengubahan RT","Cadangan PBPT atau arahan Jawatankuasa mengikut Seksyen 16.",["16"],"Adakah pengubahan diperlukan?","Teruskan penyediaan cadangan.","Kekalkan RT semasa dan kaji semula."],["Tatacara pengubahan","Pakai subseksyen 12(8), 12(9) dan Seksyen 13–15 sebagaimana terpakai.",["12","13","14","15","16"]]],"ganti":[["Cadangan penggantian RT","Cadangan PBPT atau arahan Jawatankuasa mengikut Seksyen 16.",["16"],"Adakah penggantian diperlukan?","Teruskan penyediaan cadangan.","Kekalkan RT semasa dan kaji semula."],["Tatacara penggantian","Pakai subseksyen 12(8), 12(9) dan Seksyen 13–15 sebagaimana terpakai.",["12","13","14","15","16"]]]};const chart=document.getElementById('chart');function el(tag,cls,text){let x=document.createElement(tag);x.className=cls;x.textContent=text||'';return x}function arrow(){chart.append(el('div','arrow','↓'))}function render(key){document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-selected',b.dataset.mode===key));chart.replaceChildren(el('div','pill','MULA'));let steps=[...opening[key],...stages];steps.forEach((a,i)=>{arrow();let box=el('section','step');box.id='rt-stage-'+i;box.append(el('h3','',(i+1)+'. '+a[0]),el('p','',a[1]));let refs=el('div','refs');a[2].forEach(n=>{let b=el('button','','Buka Seksyen '+n);b.onclick=()=>parent.postMessage({myaktaRTSection:n},'*');refs.append(b)});box.append(refs);chart.append(box);if(a[3]){arrow();let d=el('div','diamond'),svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),poly=document.createElementNS('http://www.w3.org/2000/svg','polygon');svg.setAttribute('viewBox','0 0 100 100');svg.setAttribute('preserveAspectRatio','none');poly.setAttribute('points','13,1 87,1 99,50 87,99 13,99 1,50');svg.append(poly);d.append(svg,el('span','',a[3]));chart.append(d);let branches=el('div','branches');[a[4],a[5]].forEach((t,j)=>{let cell=el('div','branch');cell.append(el('b','',j?'TIDAK':'YA'),el('p','',t));let b=el('button','', '↪ Teruskan');b.onclick=()=>document.getElementById('rt-stage-'+(i+1))?.scrollIntoView({behavior:'smooth',block:'center'});cell.append(b);branches.append(cell)});chart.append(branches)}});arrow();chart.append(el('div','pill','TAMAT — Tindakan RT mengikut tatacara statutori'));window.scrollTo(0,0)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>render(b.dataset.mode));render('sedia');</script></body></html>
